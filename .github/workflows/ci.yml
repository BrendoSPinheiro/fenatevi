name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nenhum passo escreve no repositório.
permissions:
  contents: read

# Uma execução por branch: um push novo cancela o anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mantida em sincronia com o .nvmrc e com `engines` do package.json.
  NODE_VERSION: '24.13.0'

jobs:
  quality:
    name: Formatação, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # `--frozen-lockfile` falha se o pnpm-lock.yaml estiver fora de sincronia
      # com o package.json, em vez de resolver as versões silenciosamente.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Verificação de tipos
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Build de produção
        run: pnpm build

  e2e:
    name: Testes E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Apenas Chromium: Firefox e WebKit entram quando a experiência visual
      # estiver definida (ver docs/architecture.md).
      - name: Instalar o navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      # O playwright.config.ts constrói e sobe a aplicação por conta própria.
      - name: Testes E2E
        run: pnpm test:e2e

      - name: Publicar o relatório do Playwright
        # Só tem valor prático quando algo falha.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
